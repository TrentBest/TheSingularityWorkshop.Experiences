name: build

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project:
          - src/Contracts/TheSingularityWorkshop.Experiences.Contracts.csproj
          - src/Forge/TheSingularityWorkshop.Experiences.Forge.csproj
          - src/Moniker/TheSingularityWorkshop.Experiences.Moniker.csproj
          - src/Moniker.Motion.Wave/TheSingularityWorkshop.Experiences.Moniker.Motion.Wave.csproj
          - src/Elements/TheSingularityWorkshop.Experiences.Elements.csproj
          - src/Chemistry/TheSingularityWorkshop.Experiences.Chemistry.csproj
          - src/Games.Cards/TheSingularityWorkshop.Games.Cards.csproj
          - src/CapsuleClinic/TheSingularityWorkshop.Experiences.CapsuleClinic.csproj
          - src/CastleSiege/TheSingularityWorkshop.Experiences.CastleSiege.csproj
          - src/DominoStudio/TheSingularityWorkshop.Experiences.DominoStudio.csproj
          - src/MarbleRun/TheSingularityWorkshop.Experiences.MarbleRun.csproj
          - src/DroneConstruction/TheSingularityWorkshop.Experiences.DroneConstruction.csproj
          - src/DroneConstruction.MicroBundles/TheSingularityWorkshop.Experiences.DroneConstruction.MicroBundles.csproj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore "${{ matrix.project }}"
      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore
      - name: Pack
        run: dotnet pack "${{ matrix.project }}" --configuration Release --no-build --output ./artifacts
      - name: Stage assembly artifact
        shell: bash
        run: |
          project="${{ matrix.project }}"
          assembly="$(basename "${project}" .csproj).dll"
          mkdir -p "./artifacts/assemblies/${{ matrix.project }}"
          cp "$(dirname "${project}")/bin/Release/net8.0/${assembly}" "./artifacts/assemblies/${{ matrix.project }}/${assembly}"


  drone-construction-showcase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run the deterministic browser showcase
        run: dotnet run --project samples/DroneConstructionShowcase/DroneConstructionShowcase.csproj --configuration Release -- ./artifacts/drone-construction-showcase.html
      - name: Upload generated browser showcase
        uses: actions/upload-artifact@v4
        with:
          name: drone-construction-browser-showcase
          path: artifacts/drone-construction-showcase.html

  # Semantic requirement matching and immutable artifact-closure validation are host-neutral contracts.
  test-semantic-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore semantic contract tests
        run: dotnet restore tests/Contracts.Tests/TheSingularityWorkshop.Experiences.Contracts.Tests.csproj
      - name: Run semantic contract tests
        run: dotnet test tests/Contracts.Tests/TheSingularityWorkshop.Experiences.Contracts.Tests.csproj --configuration Release --no-restore

  test-chemistry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run chemistry conservation tests
        run: dotnet test tests/Chemistry.Tests/TheSingularityWorkshop.Experiences.Chemistry.Tests.csproj --configuration Release

  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and pack
        run: |
          dotnet restore src/Forge/TheSingularityWorkshop.Experiences.Forge.csproj
          dotnet restore src/Moniker/TheSingularityWorkshop.Experiences.Moniker.csproj
          dotnet restore src/Moniker.Motion.Wave/TheSingularityWorkshop.Experiences.Moniker.Motion.Wave.csproj
          dotnet restore src/Elements/TheSingularityWorkshop.Experiences.Elements.csproj
          dotnet restore src/Games.Cards/TheSingularityWorkshop.Games.Cards.csproj
          dotnet restore src/CapsuleClinic/TheSingularityWorkshop.Experiences.CapsuleClinic.csproj
          dotnet restore src/CastleSiege/TheSingularityWorkshop.Experiences.CastleSiege.csproj
          dotnet restore src/DominoStudio/TheSingularityWorkshop.Experiences.DominoStudio.csproj
          dotnet restore src/MarbleRun/TheSingularityWorkshop.Experiences.MarbleRun.csproj
          dotnet restore src/DroneConstruction/TheSingularityWorkshop.Experiences.DroneConstruction.csproj
          dotnet restore src/DroneConstruction.MicroBundles/TheSingularityWorkshop.Experiences.DroneConstruction.MicroBundles.csproj
          dotnet pack src/Forge/TheSingularityWorkshop.Experiences.Forge.csproj --configuration Release --output ./artifacts
          dotnet pack src/Moniker/TheSingularityWorkshop.Experiences.Moniker.csproj --configuration Release --output ./artifacts
          dotnet pack src/Moniker.Motion.Wave/TheSingularityWorkshop.Experiences.Moniker.Motion.Wave.csproj --configuration Release --output ./artifacts
          dotnet pack src/Elements/TheSingularityWorkshop.Experiences.Elements.csproj --configuration Release --output ./artifacts
          dotnet pack src/Games.Cards/TheSingularityWorkshop.Games.Cards.csproj --configuration Release --output ./artifacts
          dotnet pack src/CapsuleClinic/TheSingularityWorkshop.Experiences.CapsuleClinic.csproj --configuration Release --output ./artifacts
          dotnet pack src/CastleSiege/TheSingularityWorkshop.Experiences.CastleSiege.csproj --configuration Release --output ./artifacts
          dotnet pack src/DominoStudio/TheSingularityWorkshop.Experiences.DominoStudio.csproj --configuration Release --output ./artifacts
          dotnet pack src/MarbleRun/TheSingularityWorkshop.Experiences.MarbleRun.csproj --configuration Release --output ./artifacts
          dotnet pack src/DroneConstruction/TheSingularityWorkshop.Experiences.DroneConstruction.csproj --configuration Release --output ./artifacts
          dotnet pack src/DroneConstruction.MicroBundles/TheSingularityWorkshop.Experiences.DroneConstruction.MicroBundles.csproj --configuration Release --output ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: experience-packages
          path: artifacts

  # Card rules stay host-neutral and are tested without GUI or MicroBundle dependencies.
  test-games-cards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore card tests
        run: dotnet restore tests/Games.Cards.Tests/TheSingularityWorkshop.Games.Cards.Tests.csproj
      - name: Run card capability tests
        run: dotnet test tests/Games.Cards.Tests/TheSingularityWorkshop.Games.Cards.Tests.csproj --configuration Release --no-restore

  # Castle Siege's initial semantic entry surface must state its current capability boundary honestly.
  # Capsule Clinic puzzle rules are deterministic and host-independent.
  test-capsule-clinic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore Capsule Clinic tests
        run: dotnet restore tests/CapsuleClinic.Tests/TheSingularityWorkshop.Experiences.CapsuleClinic.Tests.csproj
      - name: Run Capsule Clinic rules and deterministic-loop tests
        run: dotnet test tests/CapsuleClinic.Tests/TheSingularityWorkshop.Experiences.CapsuleClinic.Tests.csproj --configuration Release --no-restore

  test-castle-siege:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore Castle Siege tests
        run: dotnet restore tests/CastleSiege.Tests/TheSingularityWorkshop.Experiences.CastleSiege.Tests.csproj
      - name: Run Castle Siege contract tests
        run: dotnet test tests/CastleSiege.Tests/TheSingularityWorkshop.Experiences.CastleSiege.Tests.csproj --configuration Release --no-restore
      - name: Restore Wargaming Hall host
        run: dotnet restore samples/CastleSiege.WargamingHall/CastleSiege.WargamingHall.csproj
      - name: Build Wargaming Hall host
        run: dotnet build samples/CastleSiege.WargamingHall/CastleSiege.WargamingHall.csproj --configuration Release --no-restore
      - name: Smoke-test Wargaming Hall host
        run: printf 'q\n' | dotnet run --project samples/CastleSiege.WargamingHall/CastleSiege.WargamingHall.csproj --configuration Release --no-build
      - name: Restore graphical Wargaming Hall host
        run: dotnet restore samples/CastleSiege.WargamingHall.Web/CastleSiege.WargamingHall.Web.csproj
      - name: Build graphical Wargaming Hall host
        run: dotnet build samples/CastleSiege.WargamingHall.Web/CastleSiege.WargamingHall.Web.csproj --configuration Release --no-restore
      - name: Smoke-test graphical Wargaming Hall API
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project samples/CastleSiege.WargamingHall.Web/CastleSiege.WargamingHall.Web.csproj --configuration Release --no-build --urls http://127.0.0.1:5099 > /tmp/castle-siege-web.log 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5099/api/state > /tmp/castle-siege-state.json; then break; fi
            sleep 1
          done
          jq -e '.scenarioKey == "castle.west-wall" and .wallIntegrity == 3 and (.legalActions | index("FireAtWestWall") != null)' /tmp/castle-siege-state.json
          curl --silent --show-error --fail http://127.0.0.1:5099/ > /tmp/castle-siege-index.html
          grep -q 'prefers-reduced-motion: reduce' /tmp/castle-siege-index.html
          grep -q 'button:focus-visible' /tmp/castle-siege-index.html
          grep -q 'id="integrity" aria-live="polite"' /tmp/castle-siege-index.html
          curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"action":"FireAtWestWall"}' http://127.0.0.1:5099/api/action > /tmp/castle-siege-action.json
          jq -e '.view.wallIntegrity == 2 and .view.activeRole == "Defender" and .acceptedEvent.ruleId == "wall.abstract-breach-point"' /tmp/castle-siege-action.json
          curl --silent --show-error --fail -X POST http://127.0.0.1:5099/api/reset > /tmp/castle-siege-reset.json
          jq -e '.wallIntegrity == 3 and .activeRole == "Attacker" and (.events | length) == 0' /tmp/castle-siege-reset.json
          illegal_status=$(curl --silent --output /tmp/castle-siege-illegal.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"action":"HoldPosition"}' http://127.0.0.1:5099/api/action)
          test "$illegal_status" = "400"
          jq -e '.error | contains("not legal")' /tmp/castle-siege-illegal.json
          curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"action":"FireAtWestWall"}' http://127.0.0.1:5099/api/action > /dev/null
          curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"action":"HoldPosition"}' http://127.0.0.1:5099/api/action > /dev/null
          curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"action":"FireAtWestWall"}' http://127.0.0.1:5099/api/action > /dev/null
          curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"action":"HoldPosition"}' http://127.0.0.1:5099/api/action > /dev/null
          curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"action":"FireAtWestWall"}' http://127.0.0.1:5099/api/action > /tmp/castle-siege-terminal.json
          jq -e '.view.outcome == "AttackerVictory" and .view.wallIntegrity == 0 and (.view.legalActions | length) == 0 and (.view.events | length) == 5' /tmp/castle-siege-terminal.json
          terminal_status=$(curl --silent --output /tmp/castle-siege-terminal-action.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"action":"FireAtWestWall"}' http://127.0.0.1:5099/api/action)
          test "$terminal_status" = "409"
          jq -e '.error | contains("session is complete")' /tmp/castle-siege-terminal-action.json

  # Validate the grid encoding and scene setup contracts used by Marble Run and Domino Studio.
  test-domino-studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore layout tests
        run: dotnet restore tests/DominoStudio.Tests/TheSingularityWorkshop.Experiences.DominoStudio.Tests.csproj
      - name: Run layout and scene contract tests
        run: dotnet test tests/DominoStudio.Tests/TheSingularityWorkshop.Experiences.DominoStudio.Tests.csproj --configuration Release --no-restore

  test-marble-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore Marble Run tests
        run: dotnet restore tests/MarbleRun.Tests/TheSingularityWorkshop.Experiences.MarbleRun.Tests.csproj
      - name: Run Marble Run scene contract tests
        run: dotnet test tests/MarbleRun.Tests/TheSingularityWorkshop.Experiences.MarbleRun.Tests.csproj --configuration Release --no-restore

  # Keep motion contracts honest without requiring a host renderer.
  test-moniker-motion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore motion tests
        run: dotnet restore tests/Moniker.Motion.Wave.Tests/TheSingularityWorkshop.Experiences.Moniker.Motion.Wave.Tests.csproj
      - name: Run motion contract tests
        run: dotnet test tests/Moniker.Motion.Wave.Tests/TheSingularityWorkshop.Experiences.Moniker.Motion.Wave.Tests.csproj --configuration Release --no-restore

  source-integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Forge/TheSingularityWorkshop.Experiences.Forge.csproj
          - src/Moniker/TheSingularityWorkshop.Experiences.Moniker.csproj
          - src/Moniker.Motion.Wave/TheSingularityWorkshop.Experiences.Moniker.Motion.Wave.csproj
          - src/Elements/TheSingularityWorkshop.Experiences.Elements.csproj
          - src/DroneConstruction.Physics/TheSingularityWorkshop.Experiences.DroneConstruction.Physics.csproj
          - src/CastleSiege/TheSingularityWorkshop.Experiences.CastleSiege.csproj
    steps:
      - name: Checkout Experiences
        uses: actions/checkout@v7
        with:
          path: Experiences

      - name: Checkout MicroBundleDomain source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: TheSingularityWorkshop.MicroBundleDomain

      - name: Checkout GUI source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: TheSingularityWorkshop.GUI

      - name: Checkout Workshop Physics source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: development
          path: TheSingularityWorkshop.Physics

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore source graph
        working-directory: Experiences
        run: dotnet restore "${{ matrix.project }}" -p:WorkshopUseRepositorySources=true

      - name: Build source graph
        working-directory: Experiences
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore -p:WorkshopUseRepositorySources=true

  source-integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Experiences
        uses: actions/checkout@v7
        with:
          path: Experiences

      - name: Checkout MicroBundleDomain source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: TheSingularityWorkshop.MicroBundleDomain

      - name: Checkout GUI source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: TheSingularityWorkshop.GUI

      - name: Checkout Workshop Physics source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: development
          path: TheSingularityWorkshop.Physics

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test Moniker.Motion.Wave against source graph
        working-directory: Experiences
        run: dotnet test tests/Moniker.Motion.Wave.Tests/TheSingularityWorkshop.Experiences.Moniker.Motion.Wave.Tests.csproj --configuration Release -p:WorkshopUseRepositorySources=true

      - name: Test Drone Construction MicroBundles against source graph
        working-directory: Experiences
        run: dotnet test tests/DroneConstruction.Tests/TheSingularityWorkshop.Experiences.DroneConstruction.Tests.csproj --configuration Release -p:WorkshopUseRepositorySources=true

      - name: Test propeller-driven quadrotor physics against Workshop Physics source
        working-directory: Experiences
        run: dotnet test tests/DroneConstruction.Physics.Tests/TheSingularityWorkshop.Experiences.DroneConstruction.Physics.Tests.csproj --configuration Release -p:WorkshopUseRepositorySources=true

      - name: Test Castle Siege against source graph
        working-directory: Experiences
        run: dotnet test tests/CastleSiege.Tests/TheSingularityWorkshop.Experiences.CastleSiege.Tests.csproj --configuration Release -p:WorkshopUseRepositorySources=true


  # Drone Construction contracts stay deterministic and independent of any renderer or Unity runtime.
  test-drone-construction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore Drone Construction tests
        run: dotnet restore tests/DroneConstruction.Tests/TheSingularityWorkshop.Experiences.DroneConstruction.Tests.csproj
      - name: Run construction, occupancy, transition, and inventory invariants
        env:
          DRONE_CONSTRUCTION_SVG_ARTIFACT: ${{ github.workspace }}/artifacts/drone-construction-snapshot.svg
        run: dotnet test tests/DroneConstruction.Tests/TheSingularityWorkshop.Experiences.DroneConstruction.Tests.csproj --configuration Release --no-restore
      - name: Upload renderer-produced snapshot SVG
        uses: actions/upload-artifact@v4
        with:
          name: drone-construction-snapshot-svg
          path: artifacts/drone-construction-snapshot.svg
          if-no-files-found: error

  # Laboratory room catalogs are structured Experience data; validate schema and navigation before consumption by any manifestation.
  validate-experience-room-catalogs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema
      - name: Validate laboratory room catalogs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate

          catalogs = [
              ("Chemistry Laboratory", Path("experiences/ChemistryLaboratory/contracts"), "chemistry-laboratory-rooms.schema.json"),
              ("Fluid Dynamics Laboratory", Path("experiences/FluidDynamicsLaboratory/contracts"), "fluid-dynamics-laboratory-rooms.schema.json"),
          ]

          for name, root, schema_name in catalogs:
              schema = json.loads((root / schema_name).read_text(encoding="utf-8"))
              catalog = json.loads((root / "rooms.json").read_text(encoding="utf-8"))
              validate(instance=catalog, schema=schema)

              rooms = catalog["rooms"]
              keys = [room["roomKey"] for room in rooms]
              sequences = [room["sequence"] for room in rooms]
              assert len(keys) == len(set(keys)), f"{name}: roomKey values must be unique"
              assert len(sequences) == len(set(sequences)), f"{name}: room sequence values must be unique"
              known = set(keys)
              for room in rooms:
                  missing = set(room.get("nextRooms", [])) - known
                  assert not missing, f'{name}: {room["roomKey"]} links to unknown rooms: {sorted(missing)}'

              print(f"Validated {len(rooms)} {name} rooms and all navigation links.")
          PY

  # Reproducible population benchmark; development only, never part of packaging/publication.
  benchmark-quadrotor-populations:
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Experiences
        uses: actions/checkout@v7
        with:
          path: Experiences

      - name: Checkout Workshop Physics source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: development
          path: TheSingularityWorkshop.Physics

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run quadrotor population benchmark
        working-directory: Experiences
        run: dotnet run --project benchmarks/DroneConstruction.Physics/TheSingularityWorkshop.Experiences.DroneConstruction.Physics.Benchmarks.csproj --configuration Release -p:WorkshopUseRepositorySources=true
