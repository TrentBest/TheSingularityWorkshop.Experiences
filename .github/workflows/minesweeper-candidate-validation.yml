name: Minesweeper trusted candidate validation

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Candidate branch ref (refs/heads/feature/...)"
        required: true
        type: string
      candidate_sha:
        description: "Exact 40-character candidate commit SHA"
        required: true
        type: string
      request_id:
        description: "Persisted Foundry/CiAi request ID"
        required: true
        type: string
      operation_id:
        description: "Persisted Foundry/CiAi operation ID"
        required: true
        type: string
      idempotency_key:
        description: "Persisted Foundry/CiAi idempotency key"
        required: true
        type: string
      task_id:
        description: "Foundry task identity"
        required: true
        type: string
      correlation_id:
        description: "Foundry task correlation identity"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-minesweeper:
    name: test-minesweeper
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      EVENT_SHA: ${{ github.sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      REQUEST_ID: ${{ inputs.request_id }}
      OPERATION_ID: ${{ inputs.operation_id }}
      IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
      TASK_ID: ${{ inputs.task_id }}
      CORRELATION_ID: ${{ inputs.correlation_id }}
    steps:
      - name: Checkout trusted workflow and test suite
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact candidate commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "TrentBest/TheSingularityWorkshop.Experiences" ]]
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$EVENT_REF" == "refs/heads/development" ]]
          [[ "$WORKFLOW_REF" == "$REPOSITORY/.github/workflows/minesweeper-candidate-validation.yml@refs/heads/development" ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ && "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$CANDIDATE_REF" == refs/heads/feature/* ]]
          git check-ref-format "$CANDIDATE_REF"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for value in "$REQUEST_ID" "$OPERATION_ID" "$IDEMPOTENCY_KEY" "$TASK_ID" "$CORRELATION_ID"; do
            [[ "$value" =~ ^[A-Za-z0-9._:-]{1,256}$ ]]
          done
          git fetch --no-tags origin "$CANDIDATE_REF:refs/remotes/origin/candidate-validation"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          fetched_candidate_sha="$(git rev-parse "refs/remotes/origin/candidate-validation^{commit}")"
          [[ "$fetched_candidate_sha" == "$CANDIDATE_SHA" ]]
          resolved_sha="$(git rev-parse "$CANDIDATE_SHA^{commit}")"
          [[ "$resolved_sha" == "$CANDIDATE_SHA" ]]
          echo "candidate_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
      - name: Verify and stage exact candidate source
        id: verify
        if: success()
        env:
          RESOLVED_CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESOLVED_CANDIDATE_SHA" == "$CANDIDATE_SHA" ]]
          git cat-file -e "${RESOLVED_CANDIDATE_SHA}^{commit}"
          mkdir -p candidate
          git archive "$RESOLVED_CANDIDATE_SHA" src/Minesweeper | tar -x -C candidate
          test -d candidate/src/Minesweeper
          test -f tests/Minesweeper.Tests/TheSingularityWorkshop.Experiences.Minesweeper.Tests.csproj
          rm -rf src/Minesweeper
          cp -a candidate/src/Minesweeper src/Minesweeper
          echo "tested_sha=$RESOLVED_CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up .NET
        if: success()
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run exact-candidate Minesweeper tests
        id: tests
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p TestResults/minesweeper
          dotnet test tests/Minesweeper.Tests/TheSingularityWorkshop.Experiences.Minesweeper.Tests.csproj --configuration Release --logger "trx;LogFileName=minesweeper.trx" --results-directory TestResults/minesweeper
          exit_code=$?
          exit "$exit_code"
      - name: Write provenance and dispatch marker
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TESTED_SHA: ${{ steps.verify.outputs.tested_sha }}
        shell: bash
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run_id, attempt = int(os.environ["RUN_ID"]), int(os.environ["RUN_ATTEMPT"])
          provenance = {
            "schema":"ciai.workflow-provenance.v1",
            "repository":os.environ["REPOSITORY"],
            "runId":run_id,
            "runAttempt":attempt,
            "workflow":{"ref":os.environ["WORKFLOW_REF"],"sha":os.environ["WORKFLOW_SHA"]},
            "event":{"name":os.environ["EVENT_NAME"],"ref":os.environ["EVENT_REF"],
              "sha":os.environ["EVENT_SHA"],"pullRequest":None},
            "checkout":{"ref":os.environ["CANDIDATE_REF"],"sha":os.environ["CANDIDATE_SHA"]}}
          marker = {"contract":"foundry.ciai-dispatch-marker.v1","requestId":os.environ["REQUEST_ID"],
            "operationId":os.environ["OPERATION_ID"],"idempotencyKey":os.environ["IDEMPOTENCY_KEY"],
            "runId":run_id,"runAttempt":attempt}
          Path("artifacts/provenance.json").write_text(json.dumps(provenance,separators=(",",":"),sort_keys=True))
          Path("artifacts/dispatch-marker.json").write_text(json.dumps(marker,separators=(",",":"),sort_keys=True))
          PY
      - name: Require non-empty TRX report
        id: report
        if: always()
        shell: bash
        run: |
          test -s TestResults/minesweeper/minesweeper.trx || { echo "::error::Required TRX report missing"; exit 1; }
      - name: Stage canonical CiAi report archive entries
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/test-results
          if [[ -s TestResults/minesweeper/minesweeper.trx ]]; then
            cp TestResults/minesweeper/minesweeper.trx artifacts/test-results/results.trx
          fi
          if [[ -s artifacts/provenance.json ]]; then
            cp artifacts/provenance.json artifacts/test-results/provenance.json
          fi
      - name: Upload exact-run CiAi test-result archive
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciai-test-results-${{ github.run_id }}-${{ github.run_attempt }}-test-minesweeper
          path: |
            artifacts/test-results/results.trx
            artifacts/test-results/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Foundry dispatch marker
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundry-dispatch-marker-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dispatch-marker.json
          if-no-files-found: error
          retention-days: 14
      - name: Require all validation and evidence stages to succeed
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          if [[ "$VERIFY_OUTCOME" != success || "$TEST_OUTCOME" != success || "$REPORT_OUTCOME" != success || "$UPLOAD_OUTCOME" != success ]]; then
            echo "Candidate validation or evidence capture did not complete successfully."
            exit 1
          fi
