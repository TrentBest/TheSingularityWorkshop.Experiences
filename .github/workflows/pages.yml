name: Experiences — Build & Publish the Observatory

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiences-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the Experience system
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Experiences.sln

      - name: Build
        run: dotnet build TheSingularityWorkshop.Experiences.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TheSingularityWorkshop.Experiences.sln --configuration Release --no-build --logger "console;verbosity=normal"

  publish:
    name: Publish the Observatory to GitHub Pages
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload the Observatory
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
