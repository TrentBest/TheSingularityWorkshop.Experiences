name: Publish Lenny to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "experiences/Lenny/**"
      - ".github/workflows/publish-lenny-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released content
        uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp experiences/Lenny/index.html _site/index.html
          cp experiences/Lenny/story.json _site/story.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
