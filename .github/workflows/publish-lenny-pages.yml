name: Publish Lenny reading preview

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v6
        with:
          ref: development

      - name: Assemble static reading site
        shell: bash
        run: |
          mkdir -p _site/experiences/Lenny
          cp experiences/Lenny/index.html _site/experiences/Lenny/index.html
          cp experiences/Lenny/story.json _site/experiences/Lenny/story.json
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./experiences/Lenny/">
            <title>Little Lenny and the Big Ocean Problem</title>
          </head>
          <body>
            <p><a href="./experiences/Lenny/">Read Little Lenny and the Big Ocean Problem</a></p>
          </body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
