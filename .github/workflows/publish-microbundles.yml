name: publish-microbundles

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Experience MicroBundle project to publish"
        required: true
        type: choice
        options:
          - Moniker
      version:
        description: "Immutable MicroBundle artifact version"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  sith-policy:
    name: Require canonical master + development branches
    # Publication must run from the released baseline, never an arbitrary feature ref.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify live remote branch inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch_file="$(mktemp)"
          trap 'rm -f "$branch_file"' EXIT

          if ! gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' > "$branch_file"; then
            echo "::error::Unable to verify the remote branch inventory; publication is blocked."
            exit 1
          fi

          sort -u "$branch_file" -o "$branch_file"
          mapfile -t branches < "$branch_file"

          {
            echo "## Sith publication gate"
            echo
            echo "- Required inventory: `master`, `development`"
            echo "- Observed branch count: ${#branches[@]}"
            echo "- Observed branches:"
            for branch in "${branches[@]}"; do
              echo "  - `$branch`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${#branches[@]}" -ne 2 ||
                "${branches[0]:-}" != "development" ||
                "${branches[1]:-}" != "master" ]]; then
            echo "::error::Sith policy requires exactly master and development. Publication is blocked."
            exit 1
          fi

  publish:
    name: Build and publish selected MicroBundle
    needs: sith-policy
    if: needs.sith-policy.result == 'success'
    runs-on: ubuntu-24.04
    environment: microbundle-publication
    permissions:
      contents: read
      id-token: write
    env:
      STORAGE_ACCOUNT_URI: ${{ secrets.MICROBUNDLE_STORAGE_ACCOUNT_URI }}
      CONTAINER_NAME: ${{ secrets.MICROBUNDLE_CONTAINER_NAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout repository implementation
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleRepository
          ref: feature/microbundle-publisher
          path: repository

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate repository configuration
        shell: bash
        run: |
          test -n "$STORAGE_ACCOUNT_URI" || {
            echo "::error::MICROBUNDLE_STORAGE_ACCOUNT_URI is not configured."
            exit 1
          }
          test -n "$CONTAINER_NAME" || {
            echo "::error::MICROBUNDLE_CONTAINER_NAME is not configured."
            exit 1
          }

      - name: Build selected MicroBundle
        env:
          INPUT_PROJECT: ${{ inputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          project_file="src/$INPUT_PROJECT/TheSingularityWorkshop.Experiences.$INPUT_PROJECT.csproj"
          dotnet restore "$project_file"
          dotnet build "$project_file" \
            --configuration Release \
            --no-restore \
            /p:ContinuousIntegrationBuild=true \
            /p:Deterministic=true

      - name: Read publication identity
        id: identity
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a valid SemVer version."
            exit 1
          fi
          bundle_id="$(python3 -c 'import json, os; print(json.load(open("src/" + os.environ["INPUT_PROJECT"] + "/microbundle.json"))["bundleId"])')"
          if [[ ! "$bundle_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::MicroBundle bundleId contains unsupported characters."
            exit 1
          fi
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack immutable repository artifact
        run: |
          assembly="src/${{ inputs.project }}/bin/Release/net8.0/TheSingularityWorkshop.Experiences.${{ inputs.project }}.dll"
          mkdir -p artifacts
          bash tools/publish-microbundle.sh \
            "$assembly" \
            "${{ steps.identity.outputs.bundle_id }}" \
            "${{ steps.identity.outputs.version }}" \
            "artifacts/${{ steps.identity.outputs.bundle_id }}.bundle"

      - name: Calculate artifact identity
        id: artifact
        shell: bash
        run: |
          hash="$(sha256sum "artifacts/${{ steps.identity.outputs.bundle_id }}.bundle" | cut -d' ' -f1)"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "Artifact: ${{ steps.identity.outputs.bundle_id }}/${{ steps.identity.outputs.version }}/$hash"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish, retrieve, and consume through repository
        run: |
          dotnet run \
            --project repository/src/Tools/TheSingularityWorkshop.MicroBundleRepository.Publisher/TheSingularityWorkshop.MicroBundleRepository.Publisher.csproj \
            --configuration Release \
            -- \
            "$STORAGE_ACCOUNT_URI" \
            "$CONTAINER_NAME" \
            "${{ steps.identity.outputs.bundle_id }}" \
            "${{ steps.identity.outputs.version }}" \
            "${{ github.workspace }}/artifacts/${{ steps.identity.outputs.bundle_id }}.bundle"

      - name: Publish artifact identity
        env:
          BUNDLE_ID: ${{ steps.identity.outputs.bundle_id }}
          BUNDLE_VERSION: ${{ steps.identity.outputs.version }}
          CONTENT_HASH: ${{ steps.artifact.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("artifacts/publication.json", "w", encoding="utf-8") as output:
              json.dump({
                  "bundleId": os.environ["BUNDLE_ID"],
                  "version": os.environ["BUNDLE_VERSION"],
                  "contentHash": os.environ["CONTENT_HASH"],
              }, output, indent=2)
              output.write("\\n")
          PY
          cat "artifacts/publication.json"
