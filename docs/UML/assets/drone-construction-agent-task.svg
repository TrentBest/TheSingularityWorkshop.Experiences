<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Drone Construction agent and task contracts UML</title><desc id="desc">ConstructionAgent owns explicit lifecycle and task state; ConstructionTaskScheduler assigns tasks in stable task-ID order and commits completion only after the assigned agent returns to idle.</desc>
<defs><style>.bg{fill:#07111f}.box{fill:#10253a;stroke:#4e789a;stroke-width:2}.head{font:700 22px Consolas,monospace;fill:#f3f8fc}.txt{font:15px Consolas,monospace;fill:#c8d8e7}.sub{font:14px Consolas,monospace;fill:#88b5d7}.rel{stroke:#89a8c3;stroke-width:2;fill:none}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#89a8c3"/></marker></defs>
<rect class="bg" width="1200" height="650" rx="18"/><text x="36" y="46" class="head" style="font-size:28px">AgentAndTaskContracts.cs — source UML</text>
<rect class="box" x="45" y="100" width="335" height="285" rx="12"/><text x="70" y="140" class="head">ConstructionAgent</text><text x="70" y="178" class="txt">AgentId · Position · State</text><text x="70" y="208" class="txt">AssignedTaskId</text><text x="70" y="238" class="txt">IsCarryingBlock</text><path d="M65 260 H360" stroke="#31516f"/><text x="70" y="290" class="sub">TryAssign</text><text x="70" y="318" class="sub">TryTransition</text><text x="70" y="346" class="sub">TryCancelAssignment</text>
<rect class="box" x="440" y="100" width="300" height="180" rx="12"/><text x="465" y="140" class="head">PlacementTask</text><text x="465" y="180" class="txt">TaskId · X · Y</text><text x="465" y="210" class="txt">BlockOrdinal</text><text x="465" y="250" class="sub">IsValid</text>
<rect class="box" x="800" y="100" width="350" height="285" rx="12"/><text x="825" y="140" class="head">ConstructionTaskScheduler</text><text x="825" y="178" class="txt">Sorted pending tasks</text><text x="825" y="208" class="txt">Assigned owner + original task</text><text x="825" y="238" class="txt">Completed task IDs</text><path d="M820 260 H1130" stroke="#31516f"/><text x="825" y="290" class="sub">Enqueue</text><text x="825" y="318" class="sub">TryAssignNext</text><text x="825" y="346" class="sub">Complete / Requeue</text>
<path class="rel" marker-end="url(#arr)" d="M440 200 H380"/><path class="rel" marker-end="url(#arr)" d="M740 200 H800"/><text x="390" y="180" class="sub">assigned to</text><text x="750" y="180" class="sub">owned by</text>
<rect class="box" x="45" y="445" width="1105" height="135" rx="12"/><text x="70" y="482" class="head">Lifecycle contract</text><text x="70" y="514" class="txt">Idle → QueuedAtEmitter → CarryingBlock → AwaitingTransition → Traveling → PlacingBlock → Idle</text><text x="70" y="546" class="sub">The model records discrete state only. It does not calculate flight physics, route geometry, or collision dynamics.</text>
</svg>