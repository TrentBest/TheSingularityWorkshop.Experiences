<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">BuildGrid UML</title><desc id="desc">BuildGrid owns a rectangular array of BuildCell objects, tracks required and placed block totals, and reports completion when every cell is complete.</desc>
<defs><style>.bg{fill:#07111f}.box{fill:#10253a;stroke:#4e789a;stroke-width:2}.head{font:700 22px Consolas,monospace;fill:#f3f8fc}.txt{font:15px Consolas,monospace;fill:#c8d8e7}.sub{font:14px Consolas,monospace;fill:#88b5d7}.rel{stroke:#89a8c3;stroke-width:2;fill:none}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#89a8c3"/></marker></defs>
<rect class="bg" width="1000" height="520" rx="18"/><text x="36" y="46" class="head" style="font-size:28px">BuildGrid.cs — source UML</text>
<rect class="box" x="80" y="105" width="390" height="300" rx="12"/><text x="108" y="145" class="head">BuildGrid</text><text x="108" y="185" class="txt">Width · Height</text><text x="108" y="215" class="txt">RequiredBlockCount</text><text x="108" y="245" class="txt">PlacedBlockCount</text><text x="108" y="275" class="txt">IsComplete</text><path d="M100 300 H450" stroke="#31516f"/><text x="108" y="335" class="sub">indexer[x,y]</text><text x="108" y="365" class="sub">TryPlaceBlock(x,y)</text><rect class="box" x="600" y="170" width="320" height="170" rx="12"/><text x="628" y="210" class="head">BuildCell [width × height]</text><text x="628" y="245" class="txt">RequiredBlocks</text><text x="628" y="275" class="txt">PlacedBlocks</text><text x="628" y="305" class="sub">TryPlaceBlock()</text><path class="rel" marker-end="url(#arr)" d="M470 255 H600"/><text x="500" y="235" class="sub">owns</text><text x="80" y="455" class="txt">Invariant: 0 ≤ PlacedBlocks ≤ RequiredBlocks per cell.</text><text x="80" y="482" class="sub">Completion is data-derived; a renderer does not declare the build complete.</text>
</svg>