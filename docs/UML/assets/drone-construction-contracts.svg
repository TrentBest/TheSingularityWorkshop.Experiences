<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Drone Construction domain contracts UML</title>
<desc id="desc">Class relationships for image height fields, traffic cell grids, skylanes, hover lanes, slipstreams, build cells, and block emitters.</desc>
<defs><style>.bg{fill:#07111f}.box{fill:#10253a;stroke:#4e789a;stroke-width:2}.head{font:700 18px Consolas,monospace;fill:#f3f8fc}.txt{font:14px Consolas,monospace;fill:#c8d8e7}.sub{font:13px Consolas,monospace;fill:#88b5d7}.rel{stroke:#89a8c3;stroke-width:2;fill:none}.arrow{fill:#89a8c3}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" class="arrow"/></marker></defs>
<rect class="bg" width="1200" height="760" rx="18"/><text x="40" y="45" class="head" style="font-size:28px">ConstructionContracts.cs — source UML</text>
<rect class="box" x="40" y="90" width="300" height="170" rx="10"/><text x="58" y="120" class="head">ImageHeightField</text><text x="58" y="148" class="txt">Width, Height</text><text x="58" y="172" class="txt">MaximumHeight, Mapping</text><text x="58" y="196" class="txt">SourceDigest</text><text x="58" y="228" class="sub">FromRgb(...) · indexer</text>
<rect class="box" x="420" y="90" width="330" height="170" rx="10"/><text x="438" y="120" class="head">TrafficCellGrid</text><text x="438" y="148" class="txt">Width × Height</text><text x="438" y="172" class="txt">GridCell → AgentId</text><text x="438" y="196" class="txt">TryOccupy / Release</text><text x="438" y="228" class="sub">exclusive occupancy</text>
<rect class="box" x="830" y="90" width="330" height="170" rx="10"/><text x="848" y="120" class="head">Skylane</text><text x="848" y="148" class="txt">LaneId, Direction</text><text x="848" y="172" class="txt">Elevation, CellsPerTick</text><text x="848" y="196" class="txt">Cells: TrafficCellGrid</text><text x="848" y="228" class="sub">directed 2D cell grid</text>
<rect class="box" x="40" y="350" width="330" height="150" rx="10"/><text x="58" y="380" class="head">HoverLane</text><text x="58" y="410" class="txt">LaneId</text><text x="58" y="434" class="txt">Cells: TrafficCellGrid</text><text x="58" y="468" class="sub">holding / admission wait</text>
<rect class="box" x="435" y="350" width="330" height="150" rx="10"/><text x="453" y="380" class="head">Slipstream</text><text x="453" y="410" class="txt">TransitionCellCount</text><text x="453" y="434" class="txt">LookaheadCells (default 5)</text><text x="453" y="468" class="sub">TryReserve / Release</text>
<rect class="box" x="830" y="350" width="330" height="150" rx="10"/><text x="848" y="380" class="head">BuildCell</text><text x="848" y="410" class="txt">RequiredBlocks</text><text x="848" y="434" class="txt">PlacedBlocks</text><text x="848" y="468" class="sub">TryPlaceBlock / IsComplete</text>
<rect class="box" x="435" y="575" width="330" height="130" rx="10"/><text x="453" y="605" class="head">BlockEmitter</text><text x="453" y="635" class="txt">EmitterId, Inventory</text><text x="453" y="659" class="txt">PickupCapacity</text><text x="453" y="687" class="sub">TryTakeBlock / Restock</text>
<path class="rel" marker-end="url(#arr)" d="M750 175 H830"/><path class="rel" marker-end="url(#arr)" d="M585 260 V310 H205 V350"/><path class="rel" marker-end="url(#arr)" d="M585 260 V350"/><path class="rel" marker-end="url(#arr)" d="M600 500 V575"/><text x="40" y="735" class="sub">Domain contracts only • no flight dynamics or full agent scheduler is implemented here.</text>
</svg>