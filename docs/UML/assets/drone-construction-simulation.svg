<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Drone Construction deterministic simulation class diagram</title>
  <desc id="desc">ConstructionSimulation coordinates BuildGrid, ConstructionTaskScheduler, ConstructionAgent, positioned BlockEmitter resources, exclusive TrafficCellGrid occupancy, and immutable ConstructionSimulationSnapshot values.</desc>
  <defs>
    <style>
      .panel{fill:#f8fafc;stroke:#334155;stroke-width:1.5}
      .head{fill:#dbeafe;stroke:#334155;stroke-width:1.5}
      .type{font:600 16px sans-serif;fill:#0f172a}
      .member{font:13px ui-monospace,monospace;fill:#1e293b}
      .note{font:13px sans-serif;fill:#334155}
      .edge{fill:none;stroke:#475569;stroke-width:1.7}
      .dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="28" y="34" class="type" font-size="22">Drone Construction — deterministic discrete simulation</text>
  <text x="28" y="56" class="note">Source-grounded UML · logical cell movement only · no flight physics or lane-transition admission implied</text>

  <rect class="head" x="330" y="90" width="340" height="46" rx="6"/>
  <text class="type" x="500" y="118" text-anchor="middle">ConstructionSimulation</text>
  <rect class="panel" x="330" y="136" width="340" height="104" rx="6"/>
  <text class="member" x="348" y="160">- BuildGrid _buildGrid</text>
  <text class="member" x="348" y="181">- ConstructionTaskScheduler _scheduler</text>
  <text class="member" x="348" y="202">- ConstructionAgent[] _agents</text>
  <text class="member" x="348" y="223">+ Step() : Snapshot</text>

  <rect class="head" x="40" y="300" width="250" height="42" rx="6"/>
  <text class="type" x="165" y="326" text-anchor="middle">BuildGrid</text>
  <rect class="panel" x="40" y="342" width="250" height="76" rx="6"/>
  <text class="member" x="56" y="366">RequiredBlockCount</text>
  <text class="member" x="56" y="387">PlacedBlockCount</text>
  <text class="member" x="56" y="408">TryPlaceBlock(x, y)</text>

  <rect class="head" x="375" y="300" width="250" height="42" rx="6"/>
  <text class="type" x="500" y="326" text-anchor="middle">ConstructionTaskScheduler</text>
  <rect class="panel" x="375" y="342" width="250" height="76" rx="6"/>
  <text class="member" x="391" y="366">TryAssignNext(agent)</text>
  <text class="member" x="391" y="387">Requeue(taskId, agent)</text>
  <text class="member" x="391" y="408">Complete(taskId, agent)</text>

  <rect class="head" x="710" y="300" width="250" height="42" rx="6"/>
  <text class="type" x="835" y="326" text-anchor="middle">ConstructionAgent</text>
  <rect class="panel" x="710" y="342" width="250" height="76" rx="6"/>
  <text class="member" x="726" y="366">Position : GridCell</text>
  <text class="member" x="726" y="387">State / IsCarryingBlock</text>
  <text class="member" x="726" y="408">TryTransition(next)</text>

  <rect class="head" x="40" y="480" width="285" height="42" rx="6"/>
  <text class="type" x="182" y="506" text-anchor="middle">PositionedBlockEmitter</text>
  <rect class="panel" x="40" y="522" width="285" height="58" rx="6"/>
  <text class="member" x="56" y="546">Position : GridCell</text>
  <text class="member" x="56" y="567">Emitter : BlockEmitter</text>

  <rect class="head" x="360" y="480" width="280" height="42" rx="6"/>
  <text class="type" x="500" y="506" text-anchor="middle">TrafficCellGrid</text>
  <rect class="panel" x="360" y="522" width="280" height="58" rx="6"/>
  <text class="member" x="376" y="546">TryOccupy / Release</text>
  <text class="member" x="376" y="567">exclusive cell ownership</text>

  <rect class="head" x="675" y="480" width="285" height="42" rx="6"/>
  <text class="type" x="817" y="506" text-anchor="middle">ConstructionSimulationSnapshot</text>
  <rect class="panel" x="675" y="522" width="285" height="58" rx="6"/>
  <text class="member" x="691" y="546">tick / counts / completion</text>
  <text class="member" x="691" y="567">agent + emitter + cell values</text>

  <path class="edge" marker-end="url(#arrow)" d="M390 240 L165 300"/>
  <path class="edge" marker-end="url(#arrow)" d="M500 240 L500 300"/>
  <path class="edge" marker-end="url(#arrow)" d="M610 240 L835 300"/>
  <path class="edge" marker-end="url(#arrow)" d="M390 240 L182 480"/>
  <path class="edge" marker-end="url(#arrow)" d="M500 240 L500 480"/>
  <path class="edge" marker-end="url(#arrow)" d="M610 240 L817 480"/>
  <text class="note" x="28" y="615">Solid arrows = direct collaborators or produced snapshots in the current source.</text>
  <text class="note" x="28" y="636">Not shown as implemented: skylane direction enforcement, hover-lane admission, slipstream reservations, replay digest, GUI.SVG observer.</text>
</svg>
