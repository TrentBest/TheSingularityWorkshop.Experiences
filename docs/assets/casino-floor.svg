<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">A living casino floor with an inspectable virtual economy</title>
<desc id="desc">A stylized neon casino interior: a cashier cage at the left, blackjack tables and players in the center, glowing slot machines at the right, and an operator strip showing wagers, payouts, chip obligations, and reconciliation. Colored animated traces represent virtual buy-in, wager, payout, and cash-out events. Simulation only, with no real-money redemption.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#090f21"/><stop offset=".55" stop-color="#17203a"/><stop offset="1" stop-color="#090f19"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172442"/><stop offset="1" stop-color="#10172a"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#283552"/><stop offset="1" stop-color="#11182b"/></linearGradient>
 <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168c76"/><stop offset="1" stop-color="#06463e"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe58a"/><stop offset="1" stop-color="#ff9c48"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#162b4a"/><stop offset="1" stop-color="#090e1c"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7ff}.muted{fill:#aebbd5}.tiny{font-size:11px;letter-spacing:1px}.flow{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:8 11;animation:travel 2.6s linear infinite}.cash{stroke:#ffd76a}.wager{stroke:#58d9ff}.payout{stroke:#ff79c6}.redeem{stroke:#64e5bf}.metric{font-size:25px;font-weight:800}.pill{fill:#111a2c;fill-opacity:.92;stroke-width:1.5}.card{fill:#fff9e9;stroke:#d7e0ed;stroke-width:1}.chip{fill:#162541;stroke-width:3}.silhouette{fill:#080e1c;stroke:#35435e;stroke-width:1.5}.reel{fill:#10172a;stroke:#607498;stroke-width:1}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-76}}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
 </style>
</defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/>
<circle cx="200" cy="250" r="170" fill="#ffd76a" opacity=".05" filter="url(#soft)"/><circle cx="920" cy="290" r="210" fill="#ff79c6" opacity=".06" filter="url(#soft)"/>
<text x="44" y="43" class="tiny" fill="#58d9ff" font-weight="800">THE SINGULARITY WORKSHOP · LIVING EXPERIENCE</text>
<text x="44" y="82" font-size="31" font-weight="800">A casino you can see. An economy you can inspect.</text>
<text x="44" y="107" class="muted" font-size="14">Virtual currency · visible game floor · auditable events · no real-money redemption</text>
