<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Story Forge evidence wall concept</title>
  <desc id="desc">A diegetic investigation board links source fragments, character cards, event cards, and timeline markers with labeled relationship strings.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c2b"/><stop offset="1" stop-color="#202a37"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 27px 'Segoe UI',sans-serif;fill:#f8fafc}.sub{font:15px 'Segoe UI',sans-serif;fill:#b8c8d8}.cardTitle{font:700 17px 'Segoe UI',sans-serif;fill:#142131}.cardText{font:13px 'Segoe UI',sans-serif;fill:#334155}.tag{font:700 12px 'Segoe UI',sans-serif;fill:#f8fafc}.string{fill:none;stroke-width:3}.label{font:12px 'Segoe UI',sans-serif;fill:#e5e7eb;paint-order:stroke;stroke:#1f2937;stroke-width:4px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="22" fill="url(#wall)"/>
  <text x="48" y="52" class="title">STORY FORGE / EVIDENCE WALL</text>
  <text x="48" y="80" class="sub">Connections are typed claims with provenance—not decorative string.</text>
  <g class="string">
    <path d="M270 215 C350 190 390 210 470 240" stroke="#f87171"/>
    <path d="M270 215 C330 320 395 380 490 420" stroke="#fbbf24"/>
    <path d="M640 240 C710 220 760 225 835 245" stroke="#f87171"/>
    <path d="M640 265 C730 350 760 390 835 425" stroke="#34d399"/>
    <path d="M575 300 C580 360 585 380 590 415" stroke="#60a5fa"/>
    <path d="M835 275 C800 440 735 520 650 585" stroke="#c084fc"/>
    <path d="M490 450 C420 510 350 560 270 600" stroke="#fbbf24"/>
    <path d="M835 455 C740 515 700 550 650 585" stroke="#34d399"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="200" height="140" rx="10" fill="#fef3c7"/><rect x="70" y="145" width="200" height="27" rx="10" fill="#b45309"/><text x="84" y="164" class="tag">SOURCE NOTE / S-014</text><text x="88" y="200" class="cardTitle">Probe observation</text><text x="88" y="223" class="cardText">“The signal changes</text><text x="88" y="242" class="cardText">before the decision.”</text><text x="88" y="265" class="cardText">Origin: field log</text>
    <rect x="470" y="195" width="170" height="115" rx="10" fill="#dbeafe"/><rect x="470" y="195" width="170" height="25" rx="10" fill="#1d4ed8"/><text x="483" y="213" class="tag">EVENT / E-031</text><text x="486" y="248" class="cardTitle">First Contact</text><text x="486" y="270" class="cardText">World time: T+42</text><text x="486" y="290" class="cardText">Canon: accepted</text>
    <rect x="835" y="175" width="250" height="120" rx="10" fill="#dcfce7"/><rect x="835" y="175" width="250" height="25" rx="10" fill="#047857"/><text x="849" y="193" class="tag">CHARACTER / C-008</text><text x="852" y="230" class="cardTitle">Commander Vael</text><text x="852" y="252" class="cardText">Knows: probe telemetry</text><text x="852" y="274" class="cardText">Believes: humans are slow</text>
    <rect x="490" y="415" width="190" height="100" rx="10" fill="#fce7f3"/><rect x="490" y="415" width="190" height="25" rx="10" fill="#9d174d"/><text x="503" y="433" class="tag">CLAIM / CL-12</text><text x="506" y="466" class="cardTitle">Reaction advantage</text><text x="506" y="489" class="cardText">Tentative hypothesis</text>
    <rect x="835" y="405" width="250" height="105" rx="10" fill="#e0e7ff"/><rect x="835" y="405" width="250" height="25" rx="10" fill="#4338ca"/><text x="849" y="423" class="tag">RELATION / R-22</text><text x="852" y="458" class="cardTitle">Misinterprets evidence</text><text x="852" y="481" class="cardText">Type: contradicts belief</text>
    <rect x="70" y="545" width="200" height="100" rx="10" fill="#fef3c7"/><rect x="70" y="545" width="200" height="25" rx="10" fill="#b45309"/><text x="84" y="563" class="tag">TIMELINE MARKER / M-3</text><text x="88" y="598" class="cardTitle">Book I / Chapter 2</text><text x="88" y="621" class="cardText">Coverage: T+40–T+45</text>
    <rect x="490" y="565" width="190" height="100" rx="10" fill="#e2e8f0"/><rect x="490" y="565" width="190" height="25" rx="10" fill="#475569"/><text x="503" y="583" class="tag">CANON STATE</text><text x="506" y="618" class="cardTitle">Accepted after review</text><text x="506" y="640" class="cardText">By author • revision 4</text>
  </g>
  <text x="320" y="198" class="label">supports</text><text x="333" y="346" class="label">derived from</text><text x="700" y="212" class="label">observed by</text><text x="700" y="364" class="label">challenges</text><text x="592" y="364" class="label">concerns</text><text x="770" y="505" class="label">changes belief</text><text x="350" y="535" class="label">appears in</text><text x="735" y="560" class="label">accepted as</text>
  <text x="48" y="718" class="sub">Concept sketch • Future implementation should expose source, certainty, authorship, and revision history on inspection.</text>
</svg>