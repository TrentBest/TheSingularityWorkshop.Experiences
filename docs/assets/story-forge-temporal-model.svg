<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Story Forge temporal model</title>
  <desc id="desc">Three distinct rows show world story time, publication order, and coverage of story time by chapters and immutable editions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071322"/><stop offset="1" stop-color="#142a3f"/></linearGradient>
    <linearGradient id="coverage" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".85"/><stop offset="1" stop-color="#818cf8" stop-opacity=".85"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a9c4db"/></marker>
    <style>
      .head{font:700 25px 'Segoe UI',sans-serif;fill:#f4f8fc}.sub{font:15px 'Segoe UI',sans-serif;fill:#b6c8d9}.label{font:700 16px 'Segoe UI',sans-serif;fill:#e5edf6}.tick{stroke:#7590a8;stroke-width:1.5}.small{font:13px 'Segoe UI',sans-serif;fill:#c6d6e4}.event{fill:#fbbf24;stroke:#fff2bf;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text x="56" y="58" class="head">STORY FORGE / TEMPORAL MODEL</text>
  <text x="56" y="86" class="sub">One world chronology. Many ways to tell it. Published snapshots stay fixed.</text>
  <rect x="42" y="116" width="1116" height="164" rx="16" fill="#0b1b2b" stroke="#29465f"/>
  <text x="68" y="151" class="label">01 / STORY TIME</text><text x="68" y="175" class="small">When events happen in the authored world</text>
  <line x1="112" y1="224" x2="1090" y2="224" stroke="#a9c4db" stroke-width="2" marker-end="url(#arrow)"/>
  <g class="tick"><line x1="160" y1="213" x2="160" y2="237"/><line x1="330" y1="213" x2="330" y2="237"/><line x1="500" y1="213" x2="500" y2="237"/><line x1="670" y1="213" x2="670" y2="237"/><line x1="840" y1="213" x2="840" y2="237"/><line x1="1010" y1="213" x2="1010" y2="237"/></g>
  <g><circle cx="260" cy="224" r="7" class="event"/><circle cx="500" cy="224" r="7" class="event"/><circle cx="545" cy="224" r="7" class="event"/><circle cx="915" cy="224" r="7" class="event"/></g>
  <text x="246" y="207" class="small">E1</text><text x="486" y="207" class="small">E2</text><text x="531" y="207" class="small">E3</text><text x="901" y="207" class="small">E4</text>
  <text x="160" y="255" class="small" text-anchor="middle">t₀</text><text x="500" y="255" class="small" text-anchor="middle">t₁</text><text x="840" y="255" class="small" text-anchor="middle">t₂</text><text x="1010" y="255" class="small" text-anchor="middle">t₃</text>
  <rect x="42" y="300" width="1116" height="130" rx="16" fill="#0b1b2b" stroke="#29465f"/>
  <text x="68" y="335" class="label">02 / PUBLICATION ORDER</text><text x="68" y="359" class="small">The sequence in which the audience encounters material</text>
  <g><rect x="160" y="382" width="240" height="28" rx="6" fill="#334155" stroke="#94a3b8"/><rect x="410" y="382" width="240" height="28" rx="6" fill="#334155" stroke="#94a3b8"/><rect x="660" y="382" width="240" height="28" rx="6" fill="#334155" stroke="#94a3b8"/></g>
  <text x="280" y="401" class="small" text-anchor="middle">Chapter 1</text><text x="530" y="401" class="small" text-anchor="middle">Chapter 2</text><text x="780" y="401" class="small" text-anchor="middle">Chapter 3</text>
  <path d="M780 378 C780 365 260 365 260 378" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="520" y="375" class="small" text-anchor="middle">A flashback can point to an earlier t</text>
  <rect x="42" y="450" width="1116" height="206" rx="16" fill="#0b1b2b" stroke="#29465f"/>
  <text x="68" y="485" class="label">03 / COVERAGE OF STORY TIME</text><text x="68" y="509" class="small">Each authored unit maps onto an interval; intervals may overlap or move backward.</text>
  <text x="74" y="552" class="small">Book I</text><rect x="160" y="533" width="410" height="26" rx="6" fill="url(#coverage)" stroke="#7ee7ef"/><text x="580" y="552" class="small">Working coverage</text>
  <text x="74" y="590" class="small">Book II</text><rect x="470" y="571" width="360" height="26" rx="6" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/><text x="840" y="590" class="small">May overlap</text>
  <text x="74" y="628" class="small">Published I</text><rect x="160" y="609" width="410" height="26" rx="6" fill="#4338ca" stroke="#c4b5fd" stroke-width="1.5"/><text x="580" y="628" class="small">Immutable edition snapshot</text>
</svg>