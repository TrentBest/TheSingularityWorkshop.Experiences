  <text x="56" y="672" class="small">DESIGN STATUS: PREFORGE</text>
  <text x="56" y="698" class="tiny">Existing wave / shallow-water primitives do not yet constitute a coupled water-and-structures world.</text>
  <text x="56" y="720" class="tiny">Next milestone: one reproducible basin experiment with output-driven visualization and inspectable evidence.</text>
</svg>