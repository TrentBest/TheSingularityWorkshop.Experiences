<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Fluid Dynamics Laboratory — conceptual department floor</title>
  <desc id="desc">A conceptual floor plan linking water gallery, wave basin, bathymetry and terrain, rainfall and runoff, vessel test tank, shoreline and structures, and evidence timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1d2b"/><stop offset="1" stop-color="#153c50"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".35"/><stop offset="1" stop-color="#60a5fa" stop-opacity=".16"/></linearGradient>
    <style>
      .label{font:700 20px system-ui,sans-serif;fill:#f0f9ff}
      .small{font:14px system-ui,sans-serif;fill:#c4e1ee}
      .tiny{font:12px system-ui,sans-serif;fill:#93b8ca}
      .room{stroke:#5d8da3;stroke-width:2;rx:16}
      .num{font:800 13px system-ui,sans-serif;fill:#08202d}
      .wire{fill:none;stroke:#5eead4;stroke-width:2;stroke-dasharray:6 7;opacity:.8}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="712" rx="24" fill="none" stroke="#35647b" stroke-width="2"/>
  <text x="56" y="66" class="small" letter-spacing="4">SINGULARITY LABORATORY / DEPARTMENT CONCEPT</text>
  <text x="56" y="108" class="label" font-size="32">FLUID DYNAMICS LABORATORY</text>
  <text x="56" y="137" class="small">Water state → waves → terrain → vessels &amp; structures → evidence</text>
  <rect x="825" y="48" width="320" height="66" rx="12" fill="#173b53" stroke="#5eead4"/>
  <text x="846" y="74" class="small" font-weight="700">CONCEPTUAL FLOOR PLAN</text>
  <text x="846" y="96" class="tiny">Not a live simulation or safety plan</text>

  <path class="wire" d="M278 252 H315 M537 252 H574 M796 252 H833 M426 340 V385 M685 340 V385 M944 340 V385 M278 495 H315 M537 495 H574 M796 495 H833"/>
  <g>
