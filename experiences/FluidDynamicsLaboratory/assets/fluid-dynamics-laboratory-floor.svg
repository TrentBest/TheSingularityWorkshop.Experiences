    <rect class="room" x="833" y="385" width="287" height="220" fill="#1b3349"/>
    <circle cx="860" cy="413" r="15" fill="#c4b5fd"/><text x="860" y="418" text-anchor="middle" class="num">07</text>
    <text x="855" y="452" class="label">Evidence &amp; Timeline</text><text x="855" y="480" class="small">Inputs · outputs · model ID</text><text x="855" y="502" class="small">Units · diagnostics · replay</text>
    <path d="M859 550 H1090 M859 574 H1090" stroke="#5d8da3" stroke-width="2"/><path d="M875 540 V561 M922 540 V581 M969 540 V561 M1016 540 V581 M1063 540 V561" stroke="#5eead4" stroke-width="3"/>
