    <rect class="room" x="574" y="385" width="222" height="220" fill="#24443d"/>
    <circle cx="601" cy="413" r="15" fill="#a3e635"/><text x="601" y="418" text-anchor="middle" class="num">06</text>
    <text x="596" y="452" class="label">Shoreline &amp; Structures</text><text x="596" y="480" class="small">Boundaries</text><text x="596" y="502" class="small">Loads / erosion not yet implied</text>
    <path d="M615 560 L651 531 L687 560 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/><rect x="651" y="526" width="14" height="37" fill="#cbd5e1"/><path d="M607 570 Q625 560 643 570 T679 570 T715 570 T751 570" fill="none" stroke="#5eead4" stroke-width="3"/>
