    <circle cx="83" cy="202" r="15" fill="#5eead4"/><text x="83" y="207" text-anchor="middle" class="num">01</text>
    <text x="78" y="240" class="label">Water Gallery</text><text x="78" y="268" class="small">State · units · boundaries</text><text x="78" y="290" class="small">Model scope</text>
    <path d="M204 207 Q216 193 228 207 T252 207" fill="none" stroke="#5eead4" stroke-width="3"/>
    <path d="M204 218 Q216 204 228 218 T252 218" fill="none" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <g>
    <rect class="room" x="315" y="174" width="222" height="166" fill="#17364f"/>
    <circle cx="342" cy="202" r="15" fill="#60a5fa"/><text x="342" y="207" text-anchor="middle" class="num">02</text>
    <text x="337" y="240" class="label">Wave Basin</text><text x="337" y="268" class="small">Initial conditions</text><text x="337" y="290" class="small">1D / 2D model boundary</text>
    <path d="M465 205 Q477 188 489 205 T513 205" fill="none" stroke="#93c5fd" stroke-width="3"/><path d="M465 220 Q477 203 489 220 T513 220" fill="none" stroke="#93c5fd" stroke-width="3"/>
  </g>
  <g>
    <rect class="room" x="574" y="174" width="222" height="166" fill="#25413d"/>
    <circle cx="601" cy="202" r="15" fill="#a3e635"/><text x="601" y="207" text-anchor="middle" class="num">03</text>
    <text x="596" y="240" class="label">Bathymetry &amp; Terrain</text><text x="596" y="268" class="small">Depth field</text><text x="596" y="290" class="small">Basin shape</text>
    <path d="M730 220 L745 202 L760 212 L777 189" fill="none" stroke="#bef264" stroke-width="3"/><path d="M730 226 H777" stroke="#bef264" stroke-width="2"/>
