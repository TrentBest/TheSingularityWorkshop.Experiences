    <text x="855" y="240" class="label">Rainfall &amp; Runoff</text><text x="855" y="268" class="small">Rain-rate input</text><text x="855" y="290" class="small">Bounded basin response</text>
    <path d="M1060 190 l-7 13 h8 l-7 14 M1081 190 l-7 13 h8 l-7 14 M1102 190 l-7 13 h8 l-7 14" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
