<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">First Contact at the Fringe</title>
  <desc id="desc">A lone human exploration vessel approaches an immense, ancient alien ring structure above a remote moon at the edge of explored human space. A distant blue signal blooms from the structure beneath a star-filled nebula.</desc>
  <defs>
    <linearGradient id="space" x2="0" y2="1"><stop stop-color="#07101f"/><stop offset=".62" stop-color="#111b38"/><stop offset="1" stop-color="#241c3d"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#9a5cba" stop-opacity=".55"/><stop offset=".48" stop-color="#4666ad" stop-opacity=".22"/><stop offset="1" stop-color="#1a254b" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x2=".9" y2=".8"><stop stop-color="#d2c7b4"/><stop offset=".34" stop-color="#737d91"/><stop offset="1" stop-color="#222d47"/></linearGradient>
    <linearGradient id="ring" x2="1" y2="1"><stop stop-color="#a6b7c7"/><stop offset=".22" stop-color="#435d7b"/><stop offset=".52" stop-color="#d3c6a4"/><stop offset=".78" stop-color="#4d6886"/><stop offset="1" stop-color="#18263f"/></linearGradient>
    <linearGradient id="signal" x2="0" y2="1"><stop stop-color="#b9f6ff" stop-opacity=".9"/><stop offset="1" stop-color="#4ac8ff" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#space)"/>
  <ellipse cx="900" cy="330" rx="680" ry="460" fill="url(#nebula)"/>
  <g fill="#e8efff">
    <circle cx="93" cy="114" r="2"/><circle cx="213" cy="244" r="1.5"/><circle cx="344" cy="78" r="2"/><circle cx="498" cy="193" r="1"/><circle cx="618" cy="89" r="2"/><circle cx="746" cy="254" r="1.5"/><circle cx="862" cy="92" r="1"/><circle cx="1014" cy="161" r="2"/><circle cx="1188" cy="72" r="1.5"/><circle cx="1327" cy="198" r="2"/><circle cx="1492" cy="103" r="1.5"/><circle cx="1541" cy="329" r="1"/>
    <circle cx="157" cy="424" r="1"/><circle cx="423" cy="382" r="1.5"/><circle cx="575" cy="479" r="1"/><circle cx="1100" cy="420" r="1.5"/><circle cx="1408" cy="482" r="1"/><circle cx="1280" cy="590" r="1.5"/><circle cx="237" cy="655" r="1.5"/><circle cx="80" cy="748" r="1"/>
  </g>
  <path d="M0 610 Q280 500 520 620 T1030 570 T1600 610 V900 H0Z" fill="#28334d" opacity=".35"/>
  <circle cx="1280" cy="270" r="105" fill="#6da8d1" opacity=".1" filter="url(#glow)"/>
  <circle cx="1280" cy="270" r="69" fill="#d9e8f1" opacity=".9"/>
  <path d="M1220 260 Q1270 218 1335 247 Q1361 280 1328 321 Q1268 350 1220 312Z" fill="#8297aa" opacity=".55"/>
  <path d="M1219 255 Q1274 203 1339 245" fill="none" stroke="#f0f6ff" stroke-opacity=".55" stroke-width="4"/>
  <!-- ancient ring megastructure -->
  <ellipse cx="860" cy="445" rx="375" ry="192" transform="rotate(-17 860 445)" fill="none" stroke="#0b1426" stroke-width="76" opacity=".8"/>
  <ellipse cx="860" cy="445" rx="375" ry="192" transform="rotate(-17 860 445)" fill="none" stroke="url(#ring)" stroke-width="54"/>
  <ellipse cx="860" cy="445" rx="350" ry="169" transform="rotate(-17 860 445)" fill="none" stroke="#d8e3e9" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 16"/>
  <path d="M510 542 Q650 620 838 618 Q1035 617 1187 482" fill="none" stroke="#7ddfff" stroke-opacity=".5" stroke-width="7" filter="url(#soft)"/>
  <path d="M510 542 Q650 620 838 618 Q1035 617 1187 482" fill="none" stroke="#a8efff" stroke-opacity=".8" stroke-width="2"/>
  <g fill="#b9d5e8" opacity=".65">
    <rect x="515" y="520" width="36" height="9" rx="4" transform="rotate(21 515 520)"/><rect x="628" y="566" width="42" height="8" rx="4" transform="rotate(9 628 566)"/><rect x="1016" y="544" width="34" height="8" rx="4" transform="rotate(-25 1016 544)"/>
  </g>
  <!-- moon and atmosphere -->
  <circle cx="855" cy="714" r="235" fill="#7ac8ec" opacity=".12" filter="url(#glow)"/>
  <circle cx="855" cy="750" r="210" fill="url(#moon)"/>
  <path d="M655 740 Q735 674 825 704 T1038 684" fill="none" stroke="#e0d8c7" stroke-opacity=".3" stroke-width="14"/>
  <path d="M704 825 Q795 765 890 795 T1034 773" fill="none" stroke="#101c31" stroke-opacity=".6" stroke-width="25"/>
  <path d="M684 660 Q750 625 815 642" fill="none" stroke="#f4ead4" stroke-opacity=".55" stroke-width="3"/>
  <!-- signal column from structure to moon -->
  <path d="M870 558 L850 746 L905 746 L887 558Z" fill="url(#signal)" opacity=".7"/>
  <path d="M879 558 L879 731" stroke="#b5f5ff" stroke-width="3" opacity=".9" filter="url(#soft)"/>
  <circle cx="879" cy="558" r="15" fill="#b7f6ff" filter="url(#glow)"/>
  <circle cx="879" cy="558" r="5" fill="#f2ffff"/>
  <!-- human survey craft -->
  <g transform="translate(260 565) rotate(-12)">
    <path d="M-84 0 L-25 -18 L56 -12 L102 0 L55 13 L-26 18Z" fill="#b6c7d6"/>
    <path d="M-25 -18 L7 -43 L42 -14 L40 14 L7 43 L-25 18Z" fill="#526a83"/>
    <path d="M-4 -12 L30 -8 L30 8 L-4 12Z" fill="#8de5f5"/>
    <path d="M-80 0 L-135 -10 L-118 0 L-135 10Z" fill="#e3edf5"/>
    <path d="M98 -3 L143 -18 L133 0 L143 18 L98 3Z" fill="#6bd7ff" opacity=".9" filter="url(#soft)"/>
    <path d="M98 -3 L143 -18 L133 0 L143 18 L98 3Z" fill="#a5eeff"/>
    <path d="M-30 -18 L-42 -42 L-8 -25 M-30 18 L-42 42 L-8 25" fill="none" stroke="#d7e3ed" stroke-width="7"/>
  </g>
  <path d="M380 564 Q510 540 630 485" fill="none" stroke="#a9d7ed" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 9"/>
  <g font-family="Georgia,serif" fill="#edf5ff">
    <text x="90" y="112" font-size="18" letter-spacing="6" opacity=".7">GALACTIC WAR / FIELD ARCHIVE 001</text>
    <text x="90" y="172" font-size="48" letter-spacing="2">FIRST CONTACT AT THE FRINGE</text>
    <text x="94" y="208" font-size="19" letter-spacing="2" opacity=".72">THE SIGNAL WAS ALREADY HERE. WE WERE LATE.</text>
  </g>
  <path d="M90 235 H490" stroke="#9bcde0" stroke-opacity=".55"/>
  <g font-family="Arial,sans-serif" fill="#dbeaf4" opacity=".7" font-size="13" letter-spacing="2">
    <text x="90" y="270">HUMAN EXPLORATION BOUNDARY</text>
    <text x="1170" y="835">UNSURVEYED REGION / NO CLAIM OF OWNERSHIP</text>
  </g>
</svg>