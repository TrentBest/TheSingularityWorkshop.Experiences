<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">A little beach cleanup</title>
<desc id="d">Lenny and his dad collect litter together on a sunny beach. Small birds cross the sky while the two characters move gently in the sea breeze.</desc>
<style>
  .actor-breathe{animation:actor-breathe 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  .actor-breathe.dad{animation-delay:-1.4s}
  .shore-birds{animation:birds-fly 18s linear infinite;transform-box:fill-box;transform-origin:center}
  .shore-birds.second{animation-delay:-9s}
  .waterline{animation:water-drift 7s ease-in-out infinite alternate}
  @keyframes actor-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes birds-fly{0%{transform:translateX(-150px) translateY(0)}50%{transform:translateX(80px) translateY(-9px)}100%{transform:translateX(300px) translateY(0)}}
  @keyframes water-drift{from{transform:translateX(-8px)}to{transform:translateX(12px)}}
  @media(prefers-reduced-motion:reduce){.actor-breathe,.shore-birds,.waterline{animation:none!important}}
</style>
<rect width="1000" height="520" rx="24" fill="#c6e8e8"/>
<circle cx="850" cy="90" r="45" fill="#ffd27a"/>
<path d="M0 215 Q230 170 480 220 T1000 210 V520 H0Z" fill="#4da7b6"/>
<path d="M0 325 Q250 290 520 330 T1000 315 V520 H0Z" fill="#eecf9c"/>
<path class="waterline" d="M0 360 Q250 330 500 365 T1000 350" fill="none" stroke="#fff0d1" stroke-width="10"/>
<g class="shore-birds" fill="none" stroke="#52747a" stroke-width="4" stroke-linecap="round"><path d="M0 0 q12 -12 24 0 q12 -12 24 0"/><path d="M58 20 q10 -10 20 0 q10 -10 20 0"/></g>
<g class="shore-birds second" fill="none" stroke="#52747a" stroke-width="3.5" stroke-linecap="round"><path d="M0 0 q10 -10 20 0 q10 -10 20 0"/><path d="M48 16 q9 -9 18 0 q9 -9 18 0"/></g>
<g class="actor-breathe"><g transform="translate(345 190)"><circle cy="38" r="34" fill="#c9855e"/><path d="M-34 35 Q-25 -8 8 5 Q33 15 34 39 Q4 23 -34 35" fill="#493b36"/><path d="M-26 75 L-32 180 H32 L25 75Z" fill="#e7ad54"/><path d="M-20 180 L-25 220 M18 180 L24 220" stroke="#c9855e" stroke-width="13" stroke-linecap="round"/><path d="M-28 103 L-70 144 M25 104 L62 132" stroke="#c9855e" stroke-width="13" stroke-linecap="round"/><path d="M-15 221 h-24 M18 221 h24" stroke="#3c5662" stroke-width="11" stroke-linecap="round"/><path d="M-82 132 l24 0 l-5 39 h-20Z" fill="#f4c64f"/></g></g>
<g class="actor-breathe dad"><g transform="translate(590 135)"><circle cy="48" r="43" fill="#c9855e"/><path d="M-42 44 Q-32 -5 9 8 Q42 19 43 49 Q3 24 -42 44" fill="#4a403a"/><path d="M-38 95 L-47 240 H47 L36 95Z" fill="#477c86"/><path d="M-30 240 L-36 295 M28 240 L37 295" stroke="#b97853" stroke-width="17" stroke-linecap="round"/><path d="M-40 125 L-88 174 M38 125 L95 158" stroke="#b97853" stroke-width="17" stroke-linecap="round"/><path d="M-48 296 h-24 M30 296 h27" stroke="#354d58" stroke-width="13" stroke-linecap="round"/><path d="M92 150 Q120 160 138 185 L125 245 H75 L70 185Z" fill="#d7a76b"/></g></g>
<g fill="#f4f5ef" stroke="#66817b" stroke-width="4"><path d="M160 360 l28 -10 l15 17 l-27 13Z"/><path d="M750 380 l35 -12 l12 18 l-30 13Z"/></g>
<path d="M180 440 Q500 415 820 440" fill="none" stroke="#d8b77f" stroke-width="5" opacity=".7"/>
</svg>